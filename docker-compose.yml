services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_production_password
      POSTGRES_DB: atlasclass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlasclass"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET_DB: postgres
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://atlas:atlas_production_password@postgres:5432/atlasclass?schema=public"
      AUTH_SECRET: "${AUTH_SECRET:-atlasclass-production-secret-key-replace-in-prod}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      AUTH_TRUST_HOST: "true"
      CONTACT_EMAIL: "support@atlasclass.app"
    ports:
      - "3000:3000"

volumes:
  pgdata:
